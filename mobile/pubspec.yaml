name: tunnel_app
description: Cliente de tunelamento com deteccao automatica de operadora
publish_to: "none"
# O build number (depois do "+") e so o contador puro (N) — o Flutter Gradle
# Plugin ja soma automaticamente o offset por ABI quando --split-per-abi e
# usado (arm64-v8a = +2000). NAO prefixar aqui, senao duplica: N=3 vira o
# versionCode final 2003 sozinho; se colocar "+2003" aqui, o build sai 4003.
#
# 3009: APK Universal com a refatoracao de rede/injecao (rotacao agressiva,
# novos SNIs por operadora, payloads com upgrade/keep-alive, headers de
# navegador no WebSocket). Precisa ser > 3008 (publicado) para o OTA detectar
# novidade em qualquer aparelho e o Android aceitar a instalacao.
version: 1.2.2+3009

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  provider: ^6.1.2

  # Rede e armazenamento
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Permissao de leitura do estado do telefone (READ_PHONE_STATE)
  permission_handler: ^11.3.1

  # Identificador estavel do aparelho (usado no controle de conexoes)
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  # Motor de tunel SSH (handshake, auth e port forwarding em Dart puro).
  # 2.22.x foi a versao conferida contra o codigo em lib/services/tunnel/.
  dartssh2: ^2.22.0

  # Motor V2Ray/Xray — ja traz VpnService + tun2socks embutidos.
  # Usado apenas quando o payload tem mode = V2RAY. 1.0.10 e a ultima publicada.
  flutter_v2ray: ^1.0.10

  # Download do APK no OTA, com progresso em tempo real.
  dio: ^5.7.0

  # Roteia a chamada de API pelo SOCKS5 local do tunel apos conectar — o
  # proprio app fica fora da VPN (bypass, evita loop de roteamento), entao
  # sem isso a API do app nunca se beneficia do tunel ja ativo.
  socks5_proxy: ^2.1.1

  # Transporte SSH-over-WebSocket (fallback contra operadoras que so liberam
  # a porta 443 para trafego HTTPS/WS reconhecivel).
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Sem declaracao de assets: o projeto nao tem nenhum, e apontar para uma
  # pasta inexistente faz o `flutter pub get` falhar. Ao adicionar imagens ou
  # fontes, crie a pasta e reponha a chave `assets:` aqui.
