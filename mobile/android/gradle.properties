# 8 GB de RAM na maquina: -Xmx8G estoura a memoria fisica e o daemon do
# Gradle crasha. 2G de heap + 1G de metaspace cabem com folga junto do
# Android Studio/VS Code abertos.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.java.home=C:/Users/user/AppData/Local/Temp/claude/C--Users-user-Nova-pasta/092ae08d-872c-4d2f-83e9-c7bcfa76fee9/scratchpad/jdk-17.0.20+8
# Evita build em paralelo, que dispara N daemons e multiplica o consumo.
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
