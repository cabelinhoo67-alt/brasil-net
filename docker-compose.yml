services:
  postgres:
    image: postgres:16-alpine
    container_name: tunnel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tunnel
      POSTGRES_PASSWORD: tunnel123
      POSTGRES_DB: tunneldb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunnel -d tunneldb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Interface web para inspecionar o banco: http://localhost:8081
  # (8080 costuma estar ocupada; troque aqui se 8081 tambem estiver)
  adminer:
    image: adminer:latest
    container_name: tunnel-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
