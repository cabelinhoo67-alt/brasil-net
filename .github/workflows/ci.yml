name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'panel/**'
      - 'bot-whatsapp/**'
      - 'vps-agent/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Validar o schema do Prisma
        working-directory: backend
        env:
          # O validate não conecta no banco; só precisa da variável existir.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        run: npx prisma validate

      - name: Checar sintaxe
        working-directory: backend
        run: |
          find src prisma -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "todos os arquivos passaram"

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Instalar dependências
        working-directory: panel
        run: npm ci

      - name: Build
        working-directory: panel
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: panel-dist
          path: panel/dist
          retention-days: 7

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Bot e agente não têm lockfile versionado; aqui só garantimos que o
      # código é sintaticamente válido antes de chegar na VPS.
      - name: Checar sintaxe do bot e do agente
        run: |
          find bot-whatsapp/src vps-agent/src -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "todos os arquivos passaram"

      - name: Validar o instalador do agente
        run: bash -n vps-agent/install.sh && echo "install.sh ok"
