name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL da API que vai dentro do APK'
        required: false
        default: 'http://10.0.2.2:3333'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # O contexto `secrets` não é confiável dentro de `if:` de step;
      # resolvemos aqui e testamos a variável depois.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Para builds reproduzíveis, troque `channel` por `flutter-version: 'X.Y.Z'`.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # O repositório versiona apenas lib/, pubspec.yaml e os dois arquivos
      # Android que são nossos. O resto do scaffolding (Gradle, wrapper,
      # recursos) é gerado aqui — assim não commitamos binários nem o
      # gradle-wrapper.jar.
      - name: Gerar scaffolding Android
        run: |
          flutter create \
            --platforms=android \
            --org br.com.tunnelsystem \
            --project-name tunnel_app \
            .

      # `flutter create` sobrescreve arquivos do template. Estes são nossos:
      # a ponte com o TelephonyManager, a VpnService e o manifesto com as
      # permissões. Restaurar do git é mais confiável que tentar impedir.
      - name: Restaurar arquivos próprios
        run: |
          git checkout -- \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/kotlin \
            pubspec.yaml
          # A MainActivity gerada no pacote errado duplicaria a nossa.
          rm -rf android/app/src/main/kotlin/br/com/tunnelsystem/tunnel_app

          # O template cria test/widget_test.dart apontando para `MyApp`, que
          # não existe aqui (a raiz é `TunnelApp`). Isso reprova o analyze.
          # O projeto não tem suíte de testes; quando tiver, versione test/ e
          # troque este rm por um `git checkout -- test`.
          rm -rf test

          echo "--- kotlin/ apos restauracao ---"
          find android/app/src/main/kotlin -name '*.kt'

      # O template usa <org>.<project_name>; nosso código Kotlin está em
      # br.com.tunnelsystem.app. Alinhamos o Gradle ao código.
      - name: Ajustar applicationId e minSdk
        run: |
          GRADLE=android/app/build.gradle
          [ -f android/app/build.gradle.kts ] && GRADLE=android/app/build.gradle.kts
          echo "usando $GRADLE"

          sed -i 's/br\.com\.tunnelsystem\.tunnel_app/br.com.tunnelsystem.app/g' "$GRADLE"

          # minSdk 26: NotificationChannel e Notification.Builder(ctx, canal)
          # são API 26, e a VpnService usa os dois sem guarda de versão.
          sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 26/' "$GRADLE"
          sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 26/' "$GRADLE"

          grep -nE 'namespace|applicationId|minSdk|compileSdk' "$GRADLE"

      - name: Instalar dependências
        run: flutter pub get

      # Falha aqui aponta o arquivo e a linha do erro em Dart. Deixar passar só
      # empurra o problema para o Gradle, onde a mensagem é muito pior.
      # Infos e warnings não bloqueiam; erros sim.
      - name: Analisar código Dart
        # Escopado em lib/: é o único código nosso, e evita que o analyzer
        # caminhe por scaffolding gerado. Verificado local com Flutter 3.44.9.
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      # Assinatura de release: opcional. Sem os secrets, o Flutter assina com a
      # chave de debug — o APK instala normalmente, mas não serve para a Play Store.
      - name: Configurar keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # --stacktrace e --verbose fazem o Gradle imprimir a causa raiz. Sem isso
      # o log só diz "assembleRelease failed", que não dá para agir em cima.
      - name: Build do APK
        env:
          API_URL: ${{ inputs.api_url || vars.API_URL || 'http://10.0.2.2:3333' }}
        run: |
          echo "API_URL embutida: $API_URL"
          flutter build apk --release \
            --dart-define=API_URL=$API_URL \
            --verbose 2>&1 | tee ../build-apk.log
          exit ${PIPESTATUS[0]}

      # O relatório do merger de manifesto e os logs do Kotlin ficam aqui;
      # é o que responde "por que o Gradle quebrou".
      - name: Coletar diagnóstico da falha
        if: failure()
        run: |
          echo "===== erros do log ====="
          grep -nE "error:|FAILURE:|Caused by:|Execution failed|> Task .* FAILED" \
            ../build-apk.log | head -60 || true

          echo "===== relatório do merger de manifesto ====="
          find android/app/build -name 'manifest-merger*report.txt' \
            -exec sh -c 'echo "--- $1 ---"; grep -iE "error|conflict" "$1" | head -40' _ {} \; || true

          echo "===== manifesto final ====="
          find android/app/build -name AndroidManifest.xml -path '*merged*' \
            -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \; | head -80 || true

      - name: Publicar log completo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-apk.log
          retention-days: 7

      - name: Renomear com o número do build
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/tunnel-app-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-app-apk
          path: mobile/build/app/outputs/flutter-apk/tunnel-app-*.apk
          retention-days: 30
          if-no-files-found: error
